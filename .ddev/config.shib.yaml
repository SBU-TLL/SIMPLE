# DDEV override: local-dev Shibboleth auth simulation + uploads dir.
# Merged on top of config.yaml by DDEV. Lives under .ddev/ — never deployed.
#
# APP_ENV gates the auth mock (.ddev/php/shib_dev_prepend.php); it defaults to
# "production" off-DDEV, so the mock cannot activate outside local development.
# MOCK_* seed the Shibboleth attributes the app reads (cn is the netID identity,
# used by pages/processor.php as the per-user uploads folder).
web_environment:
  - APP_ENV=local
  - MOCK_CN=teststudent
  - MOCK_MAIL=teststudent@stonybrook.edu
  - MOCK_NICKNAME=Test
  - MOCK_SN=Student

# `uploads` is a symlink to a production path (../userData/SIMPLE/uploads); create
# that target inside the container so processor.php uploads work locally.
# Local-only; does not touch the committed symlink.
hooks:
  post-start:
    - exec: mkdir -p /var/www/userData/SIMPLE/uploads
