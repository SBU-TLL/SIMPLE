; DDEV-only PHP settings for SIMPLE local development.
; Loaded ONLY inside the DDEV container — never deployed to Azure.
;
; auto_prepend_file runs the hardened Shibboleth auth mock before every PHP
; request (no application source edited). It is fail-closed / APP_ENV-gated.
auto_prepend_file = /var/www/html/.ddev/php/shib_dev_prepend.php

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_STRICT
